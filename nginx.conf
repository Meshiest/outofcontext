# Out Of Context - nginx reverse proxy (TLS termination + HTTP/2 + SSE-safe proxying).
#
# Model: PURE REVERSE PROXY. The app container (Express, main.ts) already serves the built client
# from public/ and owns the SPA fallback, so nginx never needs the static assets on disk. It only
# terminates TLS, speaks HTTP/2 to browsers (so many concurrent SSE streams are not capped by the
# HTTP/1.1 ~6-connections-per-origin limit), and forwards everything to the app on 127.0.0.1:8080.
#
# Alternative model (not used here): if you co-locate the built public/ with the nginx host, serve
# it directly - `root /path/to/outofcontext/public;` + `try_files $uri /index.html;` in `location /`
# - and proxy ONLY /trpc/ and /api/. We chose pure proxy because the assets live inside the app
# image, keeping Express the single source of truth for static + SPA fallback.

# Redirect all plaintext HTTP to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name _;              # PLACEHOLDER - set to your domain (e.g. outofcontext.party).
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;              # PLACEHOLDER - set to your domain.

  # TLS - replace these placeholder paths with your real certificate + private key.
  ssl_certificate     /etc/ssl/certs/cert.crt;       # PLACEHOLDER
  ssl_certificate_key /etc/ssl/private/key.key;       # PLACEHOLDER
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Common proxy settings applied to every location below (nginx inherits these into locations).
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";     # HTTP/1.1 keepalive to upstream; NOT a WS upgrade.
  proxy_redirect off;

  # tRPC subscriptions are Server-Sent Events (Content-Type: text/event-stream) - long-lived and
  # MUST NOT be buffered or cached by the proxy, or events arrive in batches / never flush. The
  # /trpc/ prefix also carries mutations/queries (small POSTs); serving the whole prefix unbuffered
  # is harmless for those. HTTP/2 to the browser (above) keeps many concurrent streams from being
  # throttled by the per-origin connection cap.
  #
  # If you ever switch the push transport to the WebSocket alternative (tRPC wsLink / Socket.IO),
  # add `proxy_set_header Upgrade $http_upgrade;` and `proxy_set_header Connection "upgrade";` here.
  # Note: declaring any proxy_set_header inside a location drops the server-level ones for that
  # location (nginx array inheritance), so re-declare Host / X-Real-IP / X-Forwarded-* here too.
  location /trpc/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    chunked_transfer_encoding on;
  }

  # REST compatibility shims (rocketcrab, lobby-exists, server info). Plain JSON - normal buffering.
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
  }

  # Everything else -> Express, which serves the built client (public/) and the SPA fallback.
  location / {
    proxy_pass http://127.0.0.1:8080;
  }
}
