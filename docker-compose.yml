# Out Of Context - production compose.
#
# The `game` image builds the client and runs the TypeScript backend via tsx (see Dockerfile).
# Compose v2 ignores the old top-level `version:` key, so it is intentionally absent.
#
# No source bind-mount: the whole-tree mount the old file used (`.:/usr/src/app`) shadowed the
# built image and nullified the build. Only the persistence save-store is mounted. For local dev
# with live reload use `npm run dev` on the host, not this file.
services:
  game:
    build:
      context: .
    restart: always
    ports:
      # host:container. PORT controls the app's listen port end to end (default 8080).
      - '${PORT:-8080}:${PORT:-8080}'
    environment:
      # Runtime server config (these ARE read at runtime, unlike VITE_ vars above).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
    volumes:
      # JSON + pako lobby saves. This is the only state that must survive restarts.
      # The host dir must be writable by uid 1000 (the container's `node` user).
      - ./persistence:/usr/src/app/persistence
    healthcheck:
      # Uses Node's global fetch (Node 22) so there is no curl/wget dependency in the image.
      test:
        [
          'CMD',
          'node',
          '-e',
          "const p=process.env.PORT||8080;fetch('http://localhost:'+p+'/api/v1/ok').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
